# ⚠️ هذا الملف جاهز لكنه ليس مفعّلاً.
#
# رمز Arena (GitHub App) لا يملك صلاحية `workflows`، فلا يستطيع إنشاء ملفات
# داخل .github/workflows/ مباشرة. لتفعيله:
#
#   mkdir -p .github/workflows
#   cp matbaa-erp-docs/ci/ci.yml .github/workflows/ci.yml
#   git add .github/workflows/ci.yml && git commit -m "ci: enable analyze+test"
#   git push
#
# أو أنشئ الملف من واجهة GitHub مباشرة (Actions ← New workflow) بنفس المحتوى.
#
# ─────────────────────────────────────────────────────────────────────────────

name: analyze-and-test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: flutter analyze + flutter test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # يفشل البناء عند أي تحذير، حتى لا تتراكم مشاكل التحليل بصمت.
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --reporter expanded
